# This is HOCON (see https://github.com/lightbend/config)
# comments can be #, //, and /* */

# The commented out configurations are to show what is available by default.
# The value of said configurations are the defaults if not specified.



#hardwareArraySize = 0x1000


# CAN hardware elements
# Elements in this array are automatically instantiated as CAN elements in Java.
# The 'nodeId' field is the CAN id, but the 'id' field is what we will use to
# refer to the element in code. Why? because there exists more hardware than
# just CAN. I would use strings for more verbosity, but strings are insanely slow.
can: [
	{
		id = 1001
		name = "drivetrain front-left drive"
		type = "motor"
		class = "sparkmax"
		nodeId = 7
		canPort = 0
		brake = true
		inverted = false
	}
	{
		id = 1002
		name = "drivetrain front-left steer"
		type = "motor"
		class = "sparkmax"
		nodeId = 8
		canPort = 0
		brake = true
		feedback = "AbsoluteEncoder"
		encoderOffset = 2.90275
		inverted = true
	}
	{
		id = 1003
		name = "drivetrain front-right drive"
		type = "motor"
		class = "sparkmax"
		nodeId = 1
		canPort = 0
		brake = true
		inverted = true
	}
	{
		id = 1004
		name = "drivetrain front-right steer"
		type = "motor"
		class = "sparkmax"
		nodeId = 2
		canPort = 0
		brake = true
		feedback = "AbsoluteEncoder"
		encoderOffset = 5.15115
		inverted = true
	}
	{
		id = 1005
		name = "drivetrain back-left drive"
		type = "motor"
		class = "sparkmax"
		nodeId = 3
		canPort = 0
		brake = true
		inverted = false
	}
	{
		id = 1006
		name = "drivetrain back-left steer"
		type = "motor"
		class = "sparkmax"
		nodeId = 4
		canPort = 0
		brake = true
		feedback = "AbsoluteEncoder"
		encoderOffset = 5.07694
		inverted = true
	}
	{
		id = 1007
		name = "drivetrain back-right drive"
		type = "motor"
		class = "sparkmax"
		nodeId = 5
		canPort = 0
		brake = true
		inverted = true
	}
	{
		id = 1008
		name = "drivetrain back-right steer"
		type = "motor"
		class = "sparkmax"
		nodeId = 6
		canPort = 0
		brake = true
		feedback = "AbsoluteEncoder"
		encoderOffset = 4.65496
		inverted = true
	}
]


# non-CAN input hardware such as the controller
input: [
	{
		id = 1
		name = "xbox controller"
		type = "controller"
		class = "xbox"
		port = 0
	}
]


# use internal ids to refer to everything
drivetrain {
	type = "swerve"
	class = "default"

	inputId = 1 # id of the default input component

	front-left {
		power = 1001
		steer = 1002
		#maxSpeedMPS = ${drivetrain.maxSpeedMPS}
	}
	front-right {
		power = 1003
		steer = 1004
		#maxSpeedMPS = ${drivetrain.maxSpeedMPS}
	}
	back-left {
		power = 1005
		steer = 1006
		#maxSpeedMPS = ${drivetrain.maxSpeedMPS}
	}
	back-right {
		power = 1007
		steer = 1008
		#maxSpeedMPS = ${drivetrain.maxSpeedMPS}
	}

	#pid {
	#	kp = 1.8
	#	ki = 0
	#	kd = 0
	#}
	#
	#maxSpeedMPS = 7.5
	#maxAcceleration = 5
	#maxAngularAcceleration = 10

	odometry {
		class = "swerve"

		# width is 0.8382 meters (33 inches). /2 = 0.4181
	   # length is 0.6858 meters (27 inches). /2 = 0.3429
		kinematics = [
			{x =  0.3429, y =  0.4181}
			{x =  0.3429, y = -0.4181}
			{x = -0.3429, y =  0.4181}
			{x = -0.3429, y = -0.4181}
		]
		gyroAngle = {}
		modulePositions = [
			{}, {}, {}, {}   # initialize 4 at angle = 0, distance = 0
		]
		#initialPose = {
		#
		#}
	}
}



# logging utilities. generally you want to log less during matches to reduce
# the amount of packets between the robot and driver station
logging {
	mode = "dev" 	# "match", "pit", "dev" in order of increasing logging
	file = "none"  # "none" or a file path to log to
	stack = 10 		# how many stack elements to print with Log.error(String message, Throwable e)
}


# Auto utilities
auto {
    auto = "disabled" # disabled / recording / etc
    recording {
        record = "none" # the file to read/write to/from
    }
}


# you also can just add whatever you want to save to this config file. For
# example, physical dimensions:
shape {
	width = 0.8382  # 33 inches as meters
	length = 0.6858 # 27 inches as meters
}
