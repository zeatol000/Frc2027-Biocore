# This is HOCON (https://github.com/lightbend/config)
# comments can be #, //, and /* */

# CAN hardware elements
can: [
	{
		id = 1001
		name = "drivetrain front-left drive"
		type = "motor"
		class = "sparkmax"
		nodeId = 1
		canBus = 0
		brake = true
		currentLimit = 40
	}
	{
		id = 1002
		name = "drivetrain front-left steer"
		type = "motor"
		class = "sparkmax"
		nodeId = 2
		canBus = 0
		brake = true
		currentLimit = 40
		feedback = "AbsoluteEncoder"
		encoderOffset = 1.2345
	}
	{
		id = 1003
		name = "drivetrain front-right drive"
		type = "motor"
		class = "sparkmax"
		nodeId = 1
		canBus = 0
		brake = true
		currentLimit = 40
	}
	{
		id = 1004
		name = "drivetrain front-right steer"
		type = "motor"
		class = "sparkmax"
		nodeId = 2
		canBus = 0
		brake = true
		currentLimit = 40
		feedback = "AbsoluteEncoder"
		encoderOffset = 1.2345
	}
	{
		id = 1005
		name = "drivetrain back-left drive"
		type = "motor"
		class = "sparkmax"
		nodeId = 1
		canBus = 0
		brake = true
		currentLimit = 40
	}
	{
		id = 1006
		name = "drivetrain back-left steer"
		type = "motor"
		class = "sparkmax"
		nodeId = 2
		canBus = 0
		brake = true
		currentLimit = 40
		feedback = "AbsoluteEncoder"
		encoderOffset = 1.2345
	}
	{
		id = 1007
		name = "drivetrain back-right drive"
		type = "motor"
		class = "sparkmax"
		nodeId = 1
		canBus = 0
		brake = true
		currentLimit = 40
	}
	{
		id = 1008
		name = "drivetrain back-right steer"
		type = "motor"
		class = "sparkmax"
		nodeId = 2
		canBus = 0
		brake = true
		currentLimit = 40
		feedback = "AbsoluteEncoder"
		encoderOffset = 1.2345
	}
]


# non-CAN input hardware such as the controller
input: [
	{
		id = 1
		port = 0
		deadband = 0.05
		type = "controller"
		class = "xbox"
	}
]


# logging utilities. generally you want to log less during matches to reduce
# the ammount of packets between the robot and driver station
logging {
	mode = "dev" # "match", "pit", "dev" in order of increasing logging
	file = "none"  # "none" or a file path to log to
}


# you also can just add whatever you want to save to this config file. For
# example, physical dimensions:
shape {
	width = 0.8382  # 33 inches as meters
	length = 0.6858 # 27 inches as meters
}
